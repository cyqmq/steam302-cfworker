name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - "manifest.example.json"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_PREFIX: ${{ secrets.KV_PREFIX }}
      MANIFEST: ${{ secrets.MANIFEST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Ensure KV namespaces and patch wrangler.toml
        run: |
          set -euo pipefail
          PREFIX="${KV_PREFIX:-steam302-cfworker}"
          for B in ROUTES HEALTH_KV; do
            N="${PREFIX}-${B,,}"
            ID="$(wrangler kv namespace list | jq -r --arg n "$N" '.[] | select(.title==$n) | .id' | head -n1 || true)"
            if [ -z "$ID" ] || [ "$ID" = "null" ]; then
              echo "creating kv namespace $N"
              ID="$(wrangler kv namespace create "$N" | jq -r '.id')"
            fi
            [ -n "$ID" ] && [ "$ID" != "null" ] || { echo "::error::cannot obtain id for $N"; exit 1; }
            echo "KV $B -> $N ($ID)"
            sed -i -E "s/(\"$B\",[[:space:]]*id = \")[^\"]*/\1$ID/" wrangler.toml
          done
          grep -n 'binding' wrangler.toml

      - name: Push MANIFEST to KV (optional)
        if: ${{ env.MANIFEST != '' }}
        run: |
          set -euo pipefail
          ID="$(sed -n 's/.*binding = "ROUTES", id = "\([^"]*\)".*/\1/p' wrangler.toml | head -n1)"
          if [ -n "$ID" ]; then
            printf '%s' "$MANIFEST" | wrangler kv key put manifest --namespace-id "$ID" --path -
          fi

      - name: Deploy
        run: wrangler deploy

      - name: Write summary
        run: |
          {
            echo "## Deployed"
            echo "- Worker name: \`$(sed -n 's/^name = "\([^"]*\)"/\1/p' wrangler.toml)\`"
            echo "- KV contents:"
            grep -n 'binding' wrangler.toml | sed 's/^/  \`/; s/$/\`/'
          } >> "$GITHUB_STEP_SUMMARY"