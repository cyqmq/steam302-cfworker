name = "steam302-cfworker"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# 生产环境建议用自定义域名（workers.dev 在大陆被墙）。
# 打通后再执行：
#   wrangler routes create acc.example.com  (或粘贴到 Cloudflare 面板：Worker -> Routes)
routes = [
  # { pattern = "acc.example.com", zone_name = "example.com", custom_domain = true },
]

# KV 为可选增强：
#   ROUTES    路由表 manifest（不装则用内置默认路由，30s 生效的 KV 覆盖能力失效）
#   HEALTH_KV 上游健康状态持久化（不装则健康状态仅存于进程内，cron 后可能重置）
# 需要时手动创建并绑定（防止一键按钮自动创建同名 KV 冲突）：
#   wrangler kv namespace create ROUTES
#   wrangler kv namespace create HEALTH_KV
# 然后在此块填写对应 id（或在 Cloudflare 面板 -> Worker -> Settings -> KV bindings）：
# kv_namespaces = [
#   { binding = "ROUTES", id = "..." },
#   { binding = "HEALTH_KV", id = "..." },
# ]

[triggers]
crons = ["*/5 * * * *"]

# 可选：Analytics Engine 埋点（先到 Cloudflare 面板创建好同名 dataset）
# analytics_engine_datasets = [
#   { binding = "ANALYTICS", dataset = "steam302_cfworker" }
# ]

# ===== 可选变量 =====
# MANIFEST：内置路由表的 JSON 兜底（KV 存在则 KV 优先，适合"随时增减域名"）
#   wrangler secret put MANIFEST（< 8KB 场景）或放这里
# ACCESS_TOKEN / ALLOW_IPS：（可选）访问控制，防止泄露额度；ALLOW_IPS 逗号分隔
# FAILOVER：{"timeout_ms":6000,"max_fails":2,"cooldown_s":45} 覆盖
#
# [vars]
# MANIFEST = '{"version":1,"failover":{"timeout_ms":6000,"max_fails":2,"cooldown_s":45},"routes":[...]}'
# ALLOW_IPS = "1.2.3.4,5.6.7.8"